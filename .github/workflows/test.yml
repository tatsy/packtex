name: test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: ty check
        run: uv run ty check

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync

      - name: pytest
        run: uv run pytest

  release:
    if: github.ref == 'refs/heads/main' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write # required to create the release and upload assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Check the tag against __version__
        id: version
        run: |
          version="$(sed -n "s/^__version__ = '\(.*\)'\$/\1/p" packtex/__init__.py)"
          if [ -z "$version" ]; then
            echo "::error::could not read __version__ from packtex/__init__.py"
            exit 1
          fi
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ ${version}."
            echo "::error::Bump packtex/__init__.py or retag as v${version}."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        run: uv build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags matching vX.Y.Z are final; anything else (v1.0.0rc1, v1.0.0.dev1)
          # is published as a prerelease. The step above requires the tag and
          # __version__ to agree exactly, so a prerelease needs the suffix in
          # packtex/__init__.py too.
          flags=(--generate-notes --title "$GITHUB_REF_NAME")
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            flags+=(--prerelease)
          fi

          # Re-running a release should refresh the assets, not fail.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; replacing its assets."
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*
          fi
