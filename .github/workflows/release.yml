name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never cancel a release midway through.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Same lint, matrix and packaging checks a pull request gets. A tag that
  # cannot pass them does not become a release.
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release and upload assets
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check the tag against __version__
        id: version
        run: |
          version="$(sed -n "s/^__version__ = '\(.*\)'\$/\1/p" packtex/__init__.py)"
          if [ -z "$version" ]; then
            echo "::error::could not read __version__ from packtex/__init__.py"
            exit 1
          fi
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ ${version}."
            echo "::error::Bump packtex/__init__.py or retag as v${version}."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        run: uv build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags matching vX.Y.Z are final; anything else (v1.0.0rc1, v1.0.0.dev1)
          # is published as a prerelease. The step above requires the tag and
          # __version__ to agree exactly, so a prerelease needs the suffix in
          # packtex/__init__.py too.
          flags=(--generate-notes --title "$GITHUB_REF_NAME")
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            flags+=(--prerelease)
          fi

          # Re-running a release should refresh the assets, not fail.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; replacing its assets."
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*
          fi
