[project]
name = "packtex"
dynamic = ["version"]
description = "Packing LaTeX sources and figures for paper submission."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["coloredlogs>=15.0.1", "joblib>=1.5.3"]

[dependency-groups]
dev = ["ruff>=0.16.3", "ty>=0.0.73"]

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 99

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM"]
ignore = ["N806", "N812", "SIM108"]
fixable = ["ALL"]
unfixable = ["F401", "F841"]

[tool.ruff.lint.isort]
length-sort = true
lines-after-imports = 2
split-on-trailing-comma = true

[tool.ty.environment]
python = ".venv"
python-version = "3.9"

[tool.ty.src]
include = ["src"]

[tool.ty.terminal]
error-on-warning = false
