[project]
name = "packtex"
dynamic = ["version"]
description = "Packing LaTeX sources and figures for paper submission."
authors = [{ name = "Tatsuya Yatagawa", email = "tatsy.mail@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["coloredlogs>=15.0.1", "joblib>=1.5.3"]

[project.scripts]
packtex = "packtex.cli:main"

[dependency-groups]
dev = ["ruff>=0.16.3", "ty>=0.0.73", "pytest>=8.0.0", "pre-commit>=4.0.0"]

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "packtex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["packtex"]

[tool.hatch.build.targets.sdist]
include = ["packtex", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The flat layout puts the working tree on sys.path, so the fast tests cannot
# tell a broken wheel from a working one. test_packaging.py closes that gap by
# installing the project for real; it is opt-in because it builds and creates a
# virtualenv. Run it with `pytest -m slow`.
addopts = "-q -m 'not slow'"
markers = ["slow: builds and installs the project into a temporary virtualenv"]

[tool.ruff]
target-version = "py39"
line-length = 99

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM"]
ignore = ["N806", "N812", "SIM108"]
fixable = ["ALL"]
unfixable = ["F401", "F841"]

[tool.ruff.lint.isort]
length-sort = true
lines-after-imports = 2
split-on-trailing-comma = true

[tool.ty.environment]
python = ".venv"
python-version = "3.9"

[tool.ty.src]
include = ["packtex", "tests"]

[tool.ty.terminal]
error-on-warning = false
