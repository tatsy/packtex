# Run `pre-commit install` once to enable these hooks.
# The rev matches the ruff pinned in pyproject.toml's dev dependency group;
# bump both together.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
